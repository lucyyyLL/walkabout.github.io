function box(g, w, h, d, x, y, z, mat = WHITE, edges = true) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  if (edges) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), EDGE);
    e.position.copy(m.position);
    g.add(e);
  }
  return m;
}

function building(x0, x1, z0, z1, floors, fh, sideFins) {
  const g = new THREE.Group(); bld.add(g);
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, Hh = floors * fh;
  box(g, x1 - x0, 0.3, z1 - z0, cx, 0, cz);
  for (let i = 1; i <= floors; i++) {
    const roof = i === floors;
    box(g, x1 - x0 + 0.6, roof ? 0.7 : 0.4, z1 - z0 + 0.6, cx, i * fh - (roof ? 0.7 : 0.4), cz);
  }
  box(g, x1 - x0, Hh, 0.4, cx, 0, z0 + 0.2);                 // back wall
  const solidX = sideFins === 'x1' ? x0 : x1, finX = sideFins === 'x1' ? x1 : x0;
  box(g, 0.4, Hh, z1 - z0, solidX + (solidX === x0 ? 0.2 : -0.2), 0, cz); // solid side
  for (let z = z0 + 1; z < z1; z += 1.6) box(g, 0.5, Hh, 0.18, finX, 0, z, WHITE, false); // fin side
  for (let x = x0; x <= x1 + 0.01; x += 5) box(g, 0.5, Hh, 0.5, x, 0, z1 - 0.25); // front columns
  return g;
}

function makeRoute(pts) {
  const V = pts.map(p => new THREE.Vector3(...p));
  const seg = [0]; for (let i = 1; i < V.length; i++) seg.push(seg[i - 1] + V[i].distanceTo(V[i - 1]));
  const len = seg[seg.length - 1];
  const at = d => {
    d = clamp(d, 0, len);
    let i = 1; while (i < seg.length - 1 && seg[i] < d) i++;
    return V[i - 1].clone().lerp(V[i], (d - seg[i - 1]) / (seg[i] - seg[i - 1] || 1));
  };
  const dots = []; for (let d = 0; d <= len; d += 0.95) dots.push(d);
  const mat = new THREE.MeshBasicMaterial({ color: C.blue, transparent: true });
  const mesh = new THREE.InstancedMesh(dotGeo, mat, dots.length);
  const m = new THREE.Matrix4(); dots.forEach((d, i) => { m.makeTranslation(...at(d).toArray()); mesh.setMatrixAt(i, m); });
  mesh.count = 0; mesh.frustumCulled = false; sceneM.add(mesh);
  return { V, seg, len, at, dots, mesh, mat, draw(d) { mesh.count = dots.filter(x => x <= d).length; } };
}

function glowTexture(rgb) {

  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function updateModel(t) {
  const p = prog(t, T.model);
  const az = lerp(0.5, -0.32, eInOut(p));
  const pull = eOut(prog(t, [T.model[0], T.model[0] + 2.3]));
  let r = lerp(190, 118, pull) - 10 * prog(t, [T.model[0] + 2.3, T.dive[0]]);
  let el = lerp(0.6, 0.38, pull);
  let pos = new THREE.Vector3(ORBIT_C.x + r * Math.sin(az) * Math.cos(el), ORBIT_C.y + r * Math.sin(el), ORBIT_C.z + r * Math.cos(az) * Math.cos(el));
  let target = ORBIT_C.clone();
  const dv = eIn(prog(t, T.dive));
  if (dv > 0) { pos.lerp(new THREE.Vector3(-8, 4, 26), dv); target.lerp(new THREE.Vector3(-8, 2.5, 10), dv); }
  camM.position.copy(pos); camM.lookAt(target); camM.updateMatrixWorld();

  const dF = eInOut(prog(t, T.routeF)) * RF.len, dS = eInOut(prog(t, T.routeS)) * RS.len;
  const ghost = eInOut(prog(t, T.ghost));
  RF.draw(dF); RS.draw(dS);
  RF.mat.color.copy(BLUE).lerp(GREY, ghost); RF.mat.opacity = lerp(1, 0.45, ghost);
  const onS = t >= T.routeS[0];
  const hp = onS ? RS.at(dS) : RF.at(dF);
  head.visible = halo.visible = onS ? dS > 0.01 : (dF > 0.01 && ghost < 0.01);
  head.position.copy(hp); halo.position.copy(hp);
  halo.scale.setScalar(6 + Math.sin(t * 7) * 0.8);
  LV.F.forEach((m, i) => { m.visible = dF >= RF.seg[6 + i * 4] - 0.5; m.material.opacity = 1 - ghost * 0.7; });
  LV.S.forEach((m, i) => { m.visible = dS >= RS.seg[7 + i] - 0.5; });
  const arriveF = dF >= RF.len - 0.01, arriveS = dS >= RS.len - 0.01;
  destPin.scale.setScalar(Math.max(arriveF ? eOut5(prog(t, [T.routeF[1], T.routeF[1] + 0.35])) : 0, 0.0001));
  pulse.visible = (arriveF && ghost < 0.01) || arriveS;
  const pp = ((t - T.routeF[1]) % 1.1) / 1.1;
  pulse.scale.setScalar(1 + pp * 3.5); pulse.material.opacity = (1 - pp) * 0.9;
  return { dF, dS, ghost };
}

  BLDG.forEach(b => { const p = project(b.at, camM); if (p.x < 1000 && p.y < 240) return; text(b.text, p.x, p.y - 14, 30, { w: 600, color: '#8a8a8a', align: 'center', alpha: fade * prog(t, [5.6, 6.2]), track: 0.08 }); });

    const d = L.r === 'S' ? st.dS : L.r === 'F' ? st.dF : Math.max(st.dF, st.dS);
    let a = eOut(clamp((d - L.d + 1.5) / 4)) * fade;
    if (L.dest) a = eOut(prog(t, [T.routeF[1] - 0.1, T.routeF[1] + 0.3])) * fade;
    if (L.r === 'F') a *= 1 - st.ghost;

    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill(); ctx.restore();

  });

  text('from the street to the room.', 120, 182, 60, { w: 600, alpha: c1 * prog(t, [6.35, 6.95]), color: '#5E5E5E', track: 0.01 });
  const c2 = prog(t, [T.ghost[0] + 0.1, T.ghost[1] + 0.3]) * fade;
  text('Routes for', 120, 118, 60, { w: 600, alpha: c2, track: 0.01 });
  text('how you move.', 120, 182, 60, { w: 600, alpha: c2, color: '#5E5E5E', track: 0.01 });

}

function phoneRect(t) {
  const pin = eOut5(prog(t, T.phoneIn));
  const sway = Math.sin(t * 1.7) * 6, bob = Math.sin(t * 3.4) * 4;
  return { x: W / 2 - 190 + sway + 40, y: lerp(1120, 168, pin) + bob, w: 380, h: 800, r: 52 };
}
// Hand in soft greyscale "clay" (stylized 3D look, no outlines). Pose: right hand, palm behind the phone,

// wrist leaving the frame to the lower right.

  g.addColorStop(0, SKIN.hi); g.addColorStop(0.55, SKIN.mid); g.addColorStop(1, SKIN.lo);

function drawPhoneFrame(R) {
  ctx.fillStyle = '#0d0d0d';
  ctx.beginPath(); ctx.roundRect(R.x - 14, R.y - 14, R.w + 28, R.h + 28, R.r + 14); ctx.roundRect(R.x, R.y, R.w, R.h, R.r); ctx.fill('evenodd');
  ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2; rr(R.x - 14, R.y - 14, R.w + 28, R.h + 28, R.r + 14); ctx.stroke();
  ctx.fillStyle = '#000'; rr(R.x + R.w / 2 - 52, R.y + 12, 104, 30, 15); ctx.fill();
}
function drawARUI(t, R, p) {
  ctx.save(); rr(R.x, R.y, R.w, R.h, R.r); ctx.clip();
  const u = R.w / 390;
  ctx.translate(R.x, R.y); ctx.scale(u, u);
  // status
  text('9:41', 34, 34, 15, { w: 600, color: C.ink, track: 0 });
  // instruction card
  ctx.fillStyle = 'rgba(11,11,11,0.9)'; rr(14, 58, 362, 118, 24); ctx.fill();
  ctx.fillStyle = C.blue; ctx.beginPath(); ctx.arc(66, 117, 32, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(66, 134); ctx.lineTo(66, 100); ctx.moveTo(53, 112); ctx.lineTo(66, 99); ctx.lineTo(79, 112); ctx.stroke();
  text(`${Math.round(lerp(24, 17, p))} m`, 114, 116, 40, { w: 600, color: '#fff', track: 0.01 });
  ctx.fillStyle = C.yellow; ctx.fillRect(114, 135, 11, 11);
  text('Then elevator to Level 3', 134, 146, 17, { color: '#d9d9d9' });
  text('ETA', 356, 88, 12, { w: 600, align: 'right', color: '#9a9a9a', track: 0.12 });
  text('9:47', 356, 116, 24, { w: 600, align: 'right', color: '#fff', track: 0.01 });
  // section view card
  const cy = 844 - 232;
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; rr(14, cy, 362, 196, 24); ctx.fill();
  ctx.strokeStyle = '#e6e6e6'; ctx.lineWidth = 1; rr(14.5, cy + .5, 361, 195, 24); ctx.stroke();
  text('SECTION VIEW', 34, cy + 34, 12, { w: 600, color: C.muted, track: 0.12 });
  text('6 min · arrive 9:47', 356, cy + 34, 14, { w: 600, align: 'right' });
  const L1 = cy + 160, L3y = cy + 80, sx = 180;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  [L1, L3y].forEach(y => { ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(356, y); ctx.stroke(); });
  ctx.strokeStyle = '#cfcfcf'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(34, cy + 120); ctx.lineTo(356, cy + 120); ctx.stroke();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(sx - 14, L3y - 30, 28, L1 - L3y + 30);
  ctx.fillStyle = C.yellow; ctx.fillRect(sx - 6, L3y - 22, 12, 12);
  text('L1', 34, L1 - 8, 11, { color: C.muted }); text('L3', 34, L3y - 8, 11, { color: C.muted });
  ctx.fillStyle = C.blue;
  const dot = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); };
  for (let x = 62; x < sx; x += 10) dot(x, L1 - 10);
  for (let y = L1 - 10; y > L3y - 10; y -= 10) dot(sx, y);
  for (let x = sx; x < 330; x += 10) dot(x, L3y - 10);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(334, L3y - 10, 6, 0, 7); ctx.fill();
  const you = lerp(70, 150, p), pr = (t * 1.2) % 1;
  ctx.fillStyle = `rgba(29,78,216,${0.35 * (1 - pr)})`; ctx.beginPath(); ctx.arc(you, L1 - 10, 8 + pr * 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(you, L1 - 10, 8, 0, 7); ctx.fill();
  ctx.fillStyle = C.blue; ctx.beginPath(); ctx.arc(you, L1 - 10, 5.5, 0, 7); ctx.fill();
  ctx.restore();
  // floating AR tag on the elevator
  const q = project(ELEV, camP, R);
  if (q.z < 1) pill('Elevator · Level 3', q.x, q.y - 26, { px: 17, dot: C.yellow });
}

function renderAR(t) {
  const p = prog(t, T.ar);
  const walk = lerp(1.2, -3.2, p);
  camA.position.set(0.12, 1.62 + Math.sin(t * 6.2) * 0.012, walk);
  camA.lookAt(0.05, 1.35, walk - 10);
  camA.updateMatrixWorld();
  // full view without the AR layer
  arPath.visible = false;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
  renderer.render(sceneA, camA);
  const R = phoneRect(t);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.roundRect(R.x, R.y, R.w, R.h, R.r); ctx.clip('evenodd');
  ctx.filter = 'blur(7px)'; ctx.drawImage(glCanvas, -20, -20, W + 40, H + 40); ctx.filter = 'none';
  ctx.restore();
  // phone camera view with the AR layer
  camP.position.set(0.18, 1.45 + Math.sin(t * 6.2) * 0.012, walk - 0.35);
  camP.lookAt(0.05, 1.05, walk - 10);
  camP.updateMatrixWorld();
  const flow = (t * 1.6) % 2.2;
  chevs.forEach((m, i) => { const z = 0.5 - i * 2.2 - flow; m.position.set(0, 0.015, z); m.material.opacity = clamp((z - walk + 26) / 4) * 0.95; m.visible = z > -25; });
  arPath.visible = true;
  const gy = H - R.y - R.h;
  renderer.setScissorTest(true);
  renderer.setScissor(R.x, gy, R.w, R.h); renderer.setViewport(R.x, gy, R.w, R.h);
  renderer.render(sceneA, camP);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
  return { R, p };
}

function scene3Overlay(t, R, p) {
  // focus: soften the world around the phone
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.roundRect(R.x - 14, R.y - 14, R.w + 28, R.h + 28, R.r + 14); ctx.fill('evenodd');
  drawHand(R);
  drawPhoneFrame(R);
  // fingertips over the frame edge
  drawARUI(t, R, p);
  drawThumb(R);
  const ca = eOut(prog(t, [T.ar[0] + 0.45, T.ar[0] + 1.05]));
  text('Follow the line.', 150, 470, 72, { w: 600, alpha: ca, track: 0.01 });
  text('Live AR guidance, with a section', 152, 536, 30, { color: '#3d3d3d', alpha: ca });
  text('view at every level change.', 152, 576, 30, { color: '#3d3d3d', alpha: ca });
}

/* --------------------------------------------------------------------------
   End card
   -------------------------------------------------------------------------- */
function endCard(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const a = eOut(prog(t, T.endText));
  ctx.save(); ctx.filter = `blur(${(1 - a) * 14}px)`;
  text('WalkAbout', W / 2, 520, lerp(150, 140, a), { w: 600, color: '#fff', align: 'center', base: 'middle', alpha: a, track: 0.02 });
  ctx.restore();
  const b = eOut(prog(t, [T.endText[0] + 0.35, T.endText[0] + 0.95]));
  text('From street to room, for everybody.', W / 2, 640, 40, { color: '#a8a8a8', align: 'center', alpha: b });
}

/* ==========================================================================
   Frame
   ========================================================================== */
function renderFrame(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  renderer.setClearColor(0x000000, 1);

  if (t < T.model[0]) {
    renderer.clear();
    scene1(t);
  } else if (t < T.model[1]) {
    const st = updateModel(t);
    renderer.render(sceneM, camM);
    scene2Overlay(t, st);
    if (t < T.uiOut[1]) { ctx.save(); ctx.globalAlpha = 1 - eOut(prog(t, T.uiOut)); scene1(t); ctx.restore(); }
    const wf = prog(t, T.white);
    if (wf > 0) { ctx.fillStyle = `rgba(255,255,255,${eInOut(wf)})`; ctx.fillRect(0, 0, W, H); }
  } else if (t < T.endFade[1]) {
    const { R, p } = renderAR(t);
    scene3Overlay(t, R, p);
    const wi = 1 - prog(t, T.arIn);
    if (wi > 0) { ctx.fillStyle = `rgba(255,255,255,${eInOut(wi)})`; ctx.fillRect(0, 0, W, H); }
    const bf = prog(t, T.endFade);
    if (bf > 0) { ctx.fillStyle = `rgba(0,0,0,${eInOut(bf)})`; ctx.fillRect(0, 0, W, H); }
  } else {
    renderer.clear();
    endCard(t);
  }
  // honest label: the product is not built yet
  const dark = t < T.model[0] + 0.3 || t >= T.endFade[1] - 0.2;
  text('Concept visualization', W - 48, H - 40, 18, { color: dark ? '#8a8a8a' : '#6a6a6a', align: 'right', alpha: 0.9 });
}

window.DUR = DUR; window.FPS = FPS; window.renderFrame = renderFrame;
window.ready = document.fonts.ready.then(() => document.fonts.load(`600 40px Jost`)).then(() => document.fonts.load(`500 40px Jost`)).then(() => true);

const params = new URLSearchParams(location.search);
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById('stage').style.transform = `scale(${s})`; }
if (!params.has('capture')) { fit(); addEventListener('resize', fit); }
if (params.has('t')) window.ready.then(() => renderFrame(parseFloat(params.get('t'))));
else if (params.has('play')) window.ready.then(() => { const t0 = performance.now(); (function loop() { renderFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
